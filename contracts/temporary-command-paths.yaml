WebDetail:
  get:
    summary: 读取本人原命令回执与独立的当前评估
    description: 当前原仓范围及已存命令族权限或temporary_order:confirm。按当前actor/r06.command.v1/原键精确读取，先核不可变台账闭环。旧expected、会话、权限快照及恢复代次不替换。当前仅可验证INTERNAL_TEST_ONLY回执，businessDecision为null，不能确认、续扫、记账或放行。Cache-Control为no-store。
    security: [{webSession: []}]
    parameters: [{$ref: '#/Key'}, {$ref: '#/Warehouse'}]
    responses: {$ref: '#/DetailResponses'}
WebOriginal:
  get:
    summary: 读取本人原命令回执的精确UTF-8字节
    description: 同详情鉴权与完整性核验，直接返回持久原业务响应bytes，无Envelope或重序列化；不包含HTTP头。Cache-Control为no-store。不存在不代表未执行或可放行。
    security: [{webSession: []}]
    parameters: [{$ref: '#/Key'}, {$ref: '#/Warehouse'}]
    responses: {$ref: '#/OriginalResponses'}
PdaDetail:
  get:
    summary: PDA读取本人原命令回执与当前评估
    description: 当前有效PDA登录及原仓范围；与Web共享同actor原键域。可用新会话读取旧回执，原会话字段不改。签名历史与当前评估严格分开，全能力false，未开放任何命令POST或业务决定。
    security: [{pdaBearer: []}]
    parameters: [{$ref: '#/Key'}, {$ref: '#/Warehouse'}]
    responses: {$ref: '#/DetailResponses'}
PdaOriginal:
  get:
    summary: PDA读取本人原命令回执的精确UTF-8字节
    description: 当前有效PDA登录、原仓及已存族权限或confirm；共享Web台账原键。核验后直接返回原bytes，Cache-Control为no-store，当前签名key未知或台账损坏失败关闭，不重新签发。
    security: [{pdaBearer: []}]
    parameters: [{$ref: '#/Key'}, {$ref: '#/Warehouse'}]
    responses: {$ref: '#/OriginalResponses'}
Key:
  name: commandId
  in: path
  required: true
  schema: {type: string, format: uuid}
Warehouse:
  name: warehouseId
  in: query
  required: true
  schema: {type: string, format: uuid}
SubmissionId:
  name: submissionId
  in: query
  required: true
  schema: {type: string, format: uuid}
WebFacts:
  get:
    summary: 读取本次临时命令所需的前置事实（只读）
    description: 仅返回客户端必须逐字回显的expected与六个绑定标量及原来源身份，供人工核对后构造命令体。不授予任何能力：不创建回执、不做决定、不放行，capabilities五项仍全false；命令POST在默认配置下仍不存在（404）。限本仓且限temporary_order:confirm或temporary_order:link持有人；输出随原上下文变化，不缓存承诺。
    security: [{webSession: []}]
    parameters: [{$ref: '#/Warehouse'}, {$ref: '#/SubmissionId'}]
    responses: {$ref: '#/FactsResponses'}
FactsResponses:
  '200':
    description: 前置事实（expected、warehouseId、submissionId、workRound、authorizationId、freezeDeviceId、sourceRecoveryEpoch、source）
    content:
      application/json:
        schema:
          allOf:
            - {$ref: './schemas.yaml#/Envelope'}
            - type: object
              properties:
                data: {$ref: './temporary-command-facts-schemas.yaml#/Facts'}
  '400': {$ref: './openapi.yaml#/components/responses/Error'}
  '401': {$ref: './openapi.yaml#/components/responses/Error'}
  '404': {$ref: './openapi.yaml#/components/responses/Error'}
  '409': {$ref: './openapi.yaml#/components/responses/Error'}
DetailResponses:
  '200':
    description: 原回执与本次只读评估，当前适用性固定UNKNOWN且无写能力
    headers:
      Cache-Control: {schema: {type: string, const: no-store}}
    content:
      application/json:
        schema:
          allOf:
            - {$ref: './schemas.yaml#/Envelope'}
            - type: object
              properties:
                data: {$ref: './temporary-command-schemas.yaml#/ReceiptView'}
  '400': {$ref: './openapi.yaml#/components/responses/Error'}
  '401': {$ref: './openapi.yaml#/components/responses/Error'}
  '404': {$ref: './openapi.yaml#/components/responses/Error'}
  '409': {$ref: './openapi.yaml#/components/responses/Error'}
PdaSourceBindings:
  get:
    summary: 读取本机 TEMP 来源当前绑定（只读，设备域）
    description: 设备用它得知自己的 TEMP 来源是否已被主管关联到正式单（映射版本+1）。仅返回本登录仓库且 creator_device_id=本机的 scope；可按原 clientOrderId 精确读取，不受批量同步页数影响。包含 canonicalOrderId、mappingVersion、workRound、phase、submissionStatus、mappingOrigin、orderNo/orderSource/orderStatus，以及 installRequired（映射来源为 CONTROLLED_LINK）。与 temporary commands 同一开关；默认关闭时该路径不存在。不授予任何写入或业务能力。
    security: [{pdaBearer: []}]
    parameters: [{$ref: '#/BindingCursor'}, {$ref: '#/PageLimit'}, {$ref: '#/BindingClientOrder'}]
    responses: {$ref: '#/BindingResponses'}
BindingClientOrder:
  name: clientOrderId
  in: query
  required: false
  schema: {type: string, format: uuid}
  description: 原TEMP来源的clientOrderId；仍限定本登录仓库和本设备，不存在或不可见时返回空页。
BindingCursor:
  name: cursor
  in: query
  required: false
  schema: {type: string, description: 上一页最后一条的 scopeId；空表示第一页}
PageLimit:
  name: limit
  in: query
  required: false
  schema: {type: integer, minimum: 1, maximum: 50, default: 20}
BindingResponses:
  '200':
    description: 本机来源绑定分页
    content:
      application/json:
        schema:
          allOf:
            - {$ref: './schemas.yaml#/Envelope'}
            - type: object
              properties:
                data: {$ref: './temporary-source-binding-schemas.yaml#/BindingPage'}
  '400': {$ref: './openapi.yaml#/components/responses/Error'}
  '401': {$ref: './openapi.yaml#/components/responses/Error'}
  '403': {$ref: './openapi.yaml#/components/responses/Error'}

OriginalResponses:
  '200':
    description: 原JSON业务回执bytes，仅INTERNAL_TEST_ONLY，不是成功出库凭证
    headers:
      Cache-Control: {schema: {type: string, const: no-store}}
    content:
      application/json:
        schema: {type: string, format: binary}
  '400': {$ref: './openapi.yaml#/components/responses/Error'}
  '401': {$ref: './openapi.yaml#/components/responses/Error'}
  '404': {$ref: './openapi.yaml#/components/responses/Error'}
  '409': {$ref: './openapi.yaml#/components/responses/Error'}
