components:
  schemas:
    HandoverFaultFenceCommand:
      $ref: './handover-fault-schema.yaml#/Command'
  securitySchemes:
    pdaBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: PDA账号密码及设备私钥认证取得的短期随机令牌；不能使用离线JWT或Web Cookie
    webSession:
      type: apiKey
      in: cookie
      name: OUTBOUND_SESSION
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    Warehouse:
      name: warehouseId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{16,80}$
    Epoch:
      name: X-Server-Recovery-Epoch
      in: header
      required: true
      schema:
        type: string
  responses:
    OrderReceipt:
      description: 不可变操作回执；同幂等键同正文重试返回原结果，即使订单后来已修订或作废
      content:
        application/json:
          schema:
            allOf:
              - $ref: ./schemas.yaml#/Envelope
              - properties:
                  data: {$ref: './order-schemas.yaml#/Receipt'}
    Error:
      description: 统一错误响应，data为null；详见IMPLEMENTED_API.md中的错误码与重试规则
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Envelope
    Import:
      description: 持久化预检结果（包括BLOCKED），200不代表库存已发布
      content:
        application/json:
          schema:
            allOf:
              - $ref: ./schemas.yaml#/Envelope
              - properties:
                  data:
                    $ref: ./schemas.yaml#/Import
