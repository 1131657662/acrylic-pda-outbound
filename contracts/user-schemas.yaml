Version:
  type: string
  pattern: '^[1-9][0-9]{0,17}$'
Status:
  type: string
  enum: [ACTIVE, DISABLED]
Warehouse:
  type: object
  required: [id, code, name]
  properties:
    id: {type: string, format: uuid}
    code: {type: string}
    name: {type: string}
Role:
  type: object
  required: [code, name, permissions, permissionNames]
  properties:
    code: {type: string}
    name: {type: string}
    permissions: {type: array, items: {type: string}}
    permissionNames: {type: array, items: {type: string}}
Options:
  type: object
  required: [roles, warehouses]
  properties:
    roles: {type: array, items: {$ref: '#/Role'}}
    warehouses: {type: array, items: {$ref: '#/Warehouse'}}
Item:
  type: object
  required: [id, username, displayName, status, rowVersion, roles, warehouses]
  properties:
    id: {type: string, format: uuid}
    username: {type: string}
    displayName: {type: string}
    status: {$ref: '#/Status'}
    rowVersion: {$ref: '#/Version'}
    roles: {type: array, items: {type: string}}
    warehouses: {type: array, items: {$ref: '#/Warehouse'}}
Page:
  type: object
  required: [items, total, page, pageSize]
  properties:
    items: {type: array, items: {$ref: '#/Item'}}
    total: {type: integer, minimum: 0}
    page: {type: integer, minimum: 1}
    pageSize: {type: integer, enum: [20, 50, 100]}
Profile:
  type: object
  required: [displayName, roles, warehouseIds, reason]
  properties:
    displayName: {type: string, minLength: 1, maxLength: 100}
    roles: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string}}
    warehouseIds: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
    reason: {type: string, minLength: 1, maxLength: 500}
Create:
  allOf:
    - $ref: '#/Profile'
    - type: object
      required: [username, password]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        password: {type: string, minLength: 8, maxLength: 72, writeOnly: true, description: 至少8字符且最多72个UTF-8字节；不自动改变既有密码}
Update:
  allOf:
    - $ref: '#/Profile'
    - type: object
      required: [expectedVersion, status]
      properties:
        expectedVersion: {$ref: '#/Version'}
        status: {$ref: '#/Status'}
Password:
  type: object
  required: [expectedVersion, password, reason]
  properties:
    expectedVersion: {$ref: '#/Version'}
    password: {type: string, minLength: 8, maxLength: 72, writeOnly: true, description: 至少8字符且最多72个UTF-8字节}
    reason: {type: string, minLength: 1, maxLength: 500}
Receipt:
  type: object
  required: [id, userId, rowVersion, status, action, createdAt]
  properties:
    id: {type: string, format: uuid}
    userId: {type: string, format: uuid}
    rowVersion: {$ref: '#/Version'}
    status: {$ref: '#/Status'}
    action: {type: string, enum: [CREATE, UPDATE, PASSWORD]}
    createdAt: {type: string, format: date-time}
History:
  type: object
  required: [items, nextCursor, hasMore]
  properties:
    nextCursor: {type: [string, 'null']}
    hasMore: {type: boolean}
    items:
      type: array
      items:
        type: object
        required: [id, action, actorName, reason, rowVersion, createdAt]
        properties:
          id: {type: string, format: uuid}
          action: {type: string, enum: [CREATE, UPDATE, PASSWORD]}
          actorName: {type: string}
          reason: {type: string}
          rowVersion: {$ref: '#/Version'}
          createdAt: {type: string, format: date-time}
