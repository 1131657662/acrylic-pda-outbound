ReceiptView:
  type: object
  additionalProperties: false
  required: [originalCommandReceiptUtf8, originalResponseSha256, currentEffect]
  properties:
    originalCommandReceiptUtf8:
      type: string
      description: 此字符串UTF-8编码后逐字节等于台账原业务回执，不能依据currentEffect重写原status或actor。
    originalResponseSha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    currentEffect: {$ref: '#/CurrentEffect'}
CurrentEffect:
  type: object
  additionalProperties: false
  required: [evaluatedAt, evaluation, applicable, serverRecoveryEpoch, serviceMode, currentContext, reasons, capabilities]
  properties:
    evaluatedAt: {type: string, format: date-time}
    evaluation:
      type: string
      enum: [UNKNOWN, COMMITTED, CURRENT_CONTEXT_MATCHES, CONTEXT_CHANGED]
      description: 合成回执为UNKNOWN；真实正常确认的历史成功为COMMITTED；短装批准只评估当前身份/来源/候选上下文。均不授予生产执行能力。
    applicable: {type: boolean, const: false}
    serverRecoveryEpoch: {type: string, pattern: '^[1-9][0-9]*$'}
    serviceMode: {type: string}
    currentContext:
      type: [object, 'null']
      description: 当前来源/映射/轮次/决定/slot/正文事实快照；不可用为null。当前变化不能撤销原成功或修改原回执。
    reasons:
      type: array
      items: {type: string}
      description: 列出已观察身份/权限/来源/候选变化。合成回执仍列业务/候选未知；真实决定列生产操作关闭及E2证据评估未完成，成功另列ORIGINAL_SUCCESS_COMMITTED。不能解释为放行资格。
    capabilities: {$ref: '#/Capabilities'}
Capabilities:
  type: object
  additionalProperties: false
  required: [writeConfirmationAvailable, releaseAllowed, mayResumeScanning, stockReleased, localDeletionAllowed]
  properties:
    writeConfirmationAvailable: {type: boolean, const: false}
    releaseAllowed: {type: boolean, const: false}
    mayResumeScanning: {type: boolean, const: false}
    stockReleased: {type: boolean, const: false}
    localDeletionAllowed: {type: boolean, const: false}
ExclusionInput:
  type: object
  additionalProperties: false
  required: [orderId, revision, rowVersion, basis, evidence, withdrawalRequestId]
  description: 显式隔离命令DUPLICATE_EXCLUDE的必需附加字段。新请求不能省略；旧合成命令仅按原字节作历史只读核验。全局reason另必填，主管不得是原操作员。
  properties:
    orderId: {type: string, format: uuid}
    revision: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    rowVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    basis: {type: string, enum: [CANCELLED, WITHDRAWN, UNRELATED]}
    evidence: {type: string, minLength: 1, maxLength: 1000, description: 非空且无控制字符的逐单核对依据}
    withdrawalRequestId: {type: [string, 'null'], format: uuid, description: WITHDRAWN必须原故障撤回请求UUID；其余必须null}
CandidateSelection:
  type: object
  additionalProperties: false
  required: [effectiveTotal, exclusions]
  description: 关联/确认决定中可选签名证明。完整candidates及total保持原查询；effectiveTotal等于total减唯一排除数。同原来源/轮次/正文/完整集合且早于本决定的完整性核验原回执才可引用，集合变化失效。
  properties:
    effectiveTotal: {type: string, pattern: '^(0|[1-9][0-9]{0,17})$'}
    exclusions:
      type: array
      minItems: 1
      maxItems: 1000
      description: 按orderId严格升序，无重复，不能包含本次关联/确认目标。
      items:
        type: object
        additionalProperties: false
        required: [orderId, receiptId, originalResponseSha256, resultingDecisionVersion]
        properties:
          orderId: {type: string, format: uuid}
          receiptId: {type: string, format: uuid}
          originalResponseSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
          resultingDecisionVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
