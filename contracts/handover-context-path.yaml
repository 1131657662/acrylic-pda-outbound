Path:
  get:
    summary: 读取交接案件、原申请及已验证故障凭据
    description: >-
      仅在 outbound.handover.commands.enabled=true 时存在；要求本仓库 order:handover 或 order:resume。
      原 REQUEST 的规范正文、原回执、摘要及签名重新核验。
      fault.receipt 仅在案件 FAULT_FENCED 时返回，经不可变设备围栏、原主管命令/签名及归档正文重新核验；坏原件返回409。
      fault.entryAvailable 仅是页面入口提示：额外故障开关开启、支持的TEMP待证据案件、独立Web主管且持有order:handover。
      所有写入前提仍由命令路由在锁内独立验证；该提示不代表扫码、释放或删除能力。
      默认故障开关关闭，capabilities仍全部false。查询不写入、不签发新回执或替原机确认。
    parameters:
      - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: warehouseId, in: query, required: true, schema: {type: string, format: uuid}}
      - name: commandType
        in: query
        required: true
        schema: {type: string, enum: [APPROVE, PREPARE, ACTIVATE, FAULT_FENCE]}
    responses:
      '200':
        description: 不缓存的案件与原件验证结果
        content:
          application/json:
            schema:
              type: object
              required: [context, expected, originalCommand, capabilities, fault]
              properties:
                context: {type: object, description: 案件事实，不替代原提交动态终态的锁内验证}
                expected: {type: object, description: 对应案件版本、状态及本人权限版本的原请求前提}
                originalCommand: {type: object, description: 经过验签绑定的原REQUEST}
                capabilities: {type: object, description: 五项能力恒false}
                fault: {$ref: '#/FaultView'}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}

FaultView:
  type: object
  additionalProperties: false
  required: [entryAvailable, sourceDeviceId, receipt]
  properties:
    entryAvailable: {type: boolean, description: 故障提交表单提示，不授予新权限}
    sourceDeviceId: {type: [string, 'null'], format: uuid}
    receipt:
      type: [object, 'null']
      description: 原故障命令签名回执；旧机ACK必须为false，保留主管身份、实物位置和可信归档截点
