NumberedOrderPage:
  type: object
  required: [items, total, page, pageSize]
  properties:
    items: {type: array, items: {$ref: '#/Summary'}}
    total: {type: integer, format: int64, minimum: 0, description: 当前仓库与筛选条件下的真实总数}
    page: {type: integer, minimum: 1, description: 实际返回的页码，空结果为1}
    pageSize: {type: integer, enum: [20, 50, 100]}
PlanLine:
  type: object
  required: [deliveryCode, plannedCount]
  properties:
    deliveryCode: {type: string, pattern: '^[A-Z0-9]{3}$'}
    plannedCount: {type: integer, minimum: 1, maximum: 2147483647}
Plan:
  type: object
  required: [vehicleNo, containerNo, notes, expectedActiveSnapshot, expectedMappingRevision, lines]
  properties:
    vehicleNo: {type: string, minLength: 1, maxLength: 40}
    containerNo: {type: string, maxLength: 40}
    notes: {type: string, maxLength: 1000}
    expectedActiveSnapshot: {type: string, format: uuid}
    expectedMappingRevision: {type: string, pattern: '^[0-9]{1,18}$'}
    lines:
      type: array
      minItems: 1
      maxItems: 1000
      description: 产品行最多1000属于请求规模保护，非单车包数限制。同一发货代码不得重复。
      items: {$ref: '#/PlanLine'}
RevisionCommand:
  type: object
  required: [expectedVersion, reason, plan]
  properties:
    expectedVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    reason: {type: string, minLength: 1, maxLength: 500}
    plan: {$ref: '#/Plan'}
    expectedPolicyVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$', description: READY订单修订必须携带，并原子重新发布；DRAFT不发布政策}
CancelCommand:
  type: object
  required: [expectedVersion, reason]
  properties:
    expectedVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    reason: {type: string, minLength: 1, maxLength: 500}
Receipt:
  type: object
  required: [id, orderId, revision, rowVersion, status]
  properties:
    id: {type: string, format: uuid}
    orderId: {type: string, format: uuid}
    revision: {type: integer, minimum: 1}
    rowVersion: {type: string}
    status: {type: string, enum: [DRAFT, READY, CANCELLED]}
Summary:
  type: object
  required: [id, orderNo, source, status, revision, rowVersion, vehicleNo, containerNo, plannedTotal, createdBy, createdAt, updatedAt]
  properties:
    id: {type: string, format: uuid}
    orderNo: {type: string}
    source: {type: string, enum: [WEB, PDA_TEMP]}
    status: {type: string, enum: [DRAFT, READY, ASSIGNED, RECALL_PENDING, REVIEW_REQUIRED, COMPLETED, CANCELLED, CONTINUING, LINKED]}
    revision: {type: integer}
    rowVersion: {type: string}
    vehicleNo: {type: string}
    containerNo: {type: string}
    plannedTotal: {type: string, description: 各产品计划相加的精确十进制整数，不设116包上限}
    createdBy: {type: string, description: 创建人显示名}
    createdAt: {type: string, format: date-time}
    updatedAt: {type: string, format: date-time}
Line:
  allOf:
    - $ref: '#/PlanLine'
    - type: object
      required: [mappingId, productId, model, name]
      properties:
        mappingId: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        model: {type: string}
        name: {type: string}
Revision:
  type: object
  required: [id, revision, inventorySnapshotId, mappingRevision, vehicleNo, containerNo, notes, plannedTotal, reason, createdBy, createdAt]
  properties:
    id: {type: string, format: uuid}
    revision: {type: integer}
    inventorySnapshotId: {type: string, format: uuid}
    mappingRevision: {type: string}
    vehicleNo: {type: string}
    containerNo: {type: string}
    notes: {type: string}
    plannedTotal: {type: string}
    reason: {type: string}
    createdBy: {type: string}
    createdAt: {type: string, format: date-time}
Detail:
  type: object
  required: [order, plan, lines]
  properties:
    order: {$ref: '#/Summary'}
    plan: {$ref: '#/Revision'}
    lines: {type: array, items: {$ref: '#/Line'}}
Pagination:
  type: object
  required: [nextCursor, hasMore]
  properties:
    nextCursor: {type: [string, 'null']}
    hasMore: {type: boolean}
OrderPage:
  allOf:
    - $ref: '#/Pagination'
    - type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/Summary'}}
RevisionPage:
  allOf:
    - $ref: '#/Pagination'
    - type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/Revision'}}
Product:
  type: object
  required: [deliveryCode, mappingId, productId, model, name, enabled, mappingVersion, snapshotCount, candidateCount]
  properties:
    deliveryCode: {type: string}
    mappingId: {type: string, format: uuid}
    productId: {type: string, format: uuid}
    model: {type: string}
    name: {type: string}
    enabled: {type: boolean}
    mappingVersion: {type: string}
    snapshotCount: {type: integer}
    candidateCount: {type: integer, description: 仅当前上游在库、未扣账且未冻结的候选，不扣其他订单占用，不等于预留承诺}
Options:
  type: object
  required: [baseline, products]
  properties:
    baseline: {$ref: './master-schemas.yaml#/Baseline'}
    products:
      allOf:
        - $ref: '#/Pagination'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/Product'}}
Preflight:
  type: object
  required: [orderVersion, baseline, checksPassed, dispatchAvailable, blockers, lines, checkedAt]
  properties:
    orderVersion: {type: string}
    baseline: {$ref: './master-schemas.yaml#/Baseline'}
    checksPassed: {type: boolean, description: 状态及版本映射检查结果；数量缺口另列提示}
    dispatchAvailable: {type: boolean, const: false, description: 此草稿检查不发布、不授权、不占用库存；发布、领取及PDA资料准备使用独立接口，正式扫码提交尚未实现}
    blockers:
      type: array
      items:
        type: object
        required: [code, message]
        properties:
          code: {type: string}
          message: {type: string}
    lines:
      type: array
      items:
        type: object
        required: [deliveryCode, plannedCount, mappingValid, snapshotCount, candidateCount, shortage]
        properties:
          deliveryCode: {type: string}
          plannedCount: {type: integer}
          mappingValid: {type: boolean}
          snapshotCount: {type: integer}
          candidateCount: {type: integer}
          shortage: {type: integer, minimum: 0}
    checkedAt: {type: string, format: date-time}
EventPage:
  allOf:
    - $ref: '#/Pagination'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, type, actor, details, serverTime]
            properties:
              id: {type: string}
              type: {type: string}
              actor: {type: [string, 'null']}
              details: {type: string, description: 审计JSON文本，含前后修订号、原因、结果版本}
              serverTime: {type: string, format: date-time}
