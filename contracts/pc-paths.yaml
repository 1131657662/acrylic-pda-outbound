Lookup:
  get:
    summary: 按原请求标识查本账号本仓本单回执；order:read；不要求仍有pc:operate
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/OrderId'}
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - name: key
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._:-]{16,80}$'}
    responses:
      '200':
        description: 真实后台资料或原操作回执；计入不等于最终出库
