View:
  get:
    summary: 本单PC作业、逐产品进度与最近提交；order:read
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/OrderId'}
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
    responses:
      '200':
        description: 真实后台资料或原操作回执；计入不等于最终出库
        content:
          application/json:
            schema:
              allOf:
                - {$ref: './schemas.yaml#/Envelope'}
                - properties:
                    data: {$ref: './pc-schemas.yaml#/View'}
      default: {$ref: './openapi.yaml#/components/responses/Error'}
Candidates:
  get:
    summary: 固定本单产品范围查包；pc:operate；每人每分钟120次，分组5条真实分页
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/OrderId'}
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - name: query
        in: query
        required: true
        schema: {type: string, minLength: 4, maxLength: 11}
      - name: code
        in: query
        required: false
        schema: {type: string, default: '', description: 留空查询所有代码；指定代码时可翻该组页}
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1, description: 查询全部代码只允许第1页；越界回末页}
    responses:
      '200':
        description: 真实后台资料或原操作回执；计入不等于最终出库
        content:
          application/json:
            schema:
              allOf:
                - {$ref: './schemas.yaml#/Envelope'}
                - properties:
                    data: {$ref: './pc-schemas.yaml#/Candidates'}
      default: {$ref: './openapi.yaml#/components/responses/Error'}
Entries:
  get:
    summary: 本单录入与撤销历史；order:read；序号倒序真实分页
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/OrderId'}
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - name: search
        in: query
        required: false
        schema: {type: string, maxLength: 11, default: ''}
      - name: code
        in: query
        required: false
        schema: {type: string, maxLength: 3, default: ''}
      - name: page
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
      - name: pageSize
        in: query
        required: false
        schema: {type: integer, enum: [20, 50, 100], default: 20}
    responses:
      '200':
        description: 真实后台资料或原操作回执；计入不等于最终出库
        content:
          application/json:
            schema:
              allOf:
                - {$ref: './schemas.yaml#/Envelope'}
                - properties:
                    data: {$ref: './pc-schemas.yaml#/Entries'}
      default: {$ref: './openapi.yaml#/components/responses/Error'}
  post:
    summary: 核对实物后逐包保存并取得全局占用；pc:operate；不接受客户端重量
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/OrderId'}
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - {$ref: './openapi.yaml#/components/parameters/Csrf'}
      - {$ref: './openapi.yaml#/components/parameters/Idempotency'}
      - {$ref: './openapi.yaml#/components/parameters/Epoch'}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: './pc-schemas.yaml#/Write'}
    responses:
      '200':
        description: 真实后台资料或原操作回执；计入不等于最终出库
        content:
          application/json:
            schema:
              allOf:
                - {$ref: './schemas.yaml#/Envelope'}
                - properties:
                    data: {$ref: './pc-schemas.yaml#/CommandReceipt'}
      default: {$ref: './openapi.yaml#/components/responses/Error'}
