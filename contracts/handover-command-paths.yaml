Execute:
  post:
    summary: 执行一次 PDA 交接命令（REQUEST/APPROVE/PREPARE/ACTIVATE/FAULT_FENCE）
    description: >-
      请求体是规范 JSON 命令，原键为 commandId：同键同文返回原回执字节，同键异文返回 409 IDEMPOTENCY_CONTENT_MISMATCH。
      命令面默认关闭（outbound.handover.commands.enabled=false 时路径不存在）；签名回执五项能力仍全为 false。
      FORMAL 激活在服务端代目标设备签发离线授权；批准或激活本身不放行库存、不恢复扫码、不允许本机删除。
      已有 canonical 目标的 TEMP 来源支持 REQUEST 及原机 stop-ack 后的主管 APPROVE；审批人与申请人须不同。
      FORMAL/TEMP 故障分支额外要求 outbound.handover.fault.enabled=true，默认关闭；仅接受已有可信归档截点且原提交实际 ABORTED。
      FORMAL 归档保留原召回 REQUESTED 及空 stop_receipt/resolution_receipt；同事务撤原assignment/offline资格，独立围栏绑定原召回恢复包，不制造原机STOP/ACK。
      FAULT_FENCE 由独立有 order:handover 的 Web 主管提交，严格匹配 FaultFence schema；原机须断电收回保管、实物位置明确且无未决输入。
      归档原 E2A STOP 是历史事实，故障分支不要求原机生成新的 handover STOP/ACK；失联可能仍作业、缺钥/原件/审计/截点一律拒绝。
      同事务写不可变故障围栏、原设备禁用/会话撤销/版本推进、案件 FAULT_FENCED、主管原请求/签名、审计与 outbox；不释放库存或记账。
      普通设备启用不能解除围栏（409 DEVICE_FAULT_FENCED），改钥/重新启用同时受数据库保护；无故障解除入口。
      故障 manifest 用 stopKind=FAULT_FENCE 与 faultReceipt，不包含 stopReceipt；审批、准备、确认、激活与历史消费重验原来源。
      FORMAL 故障、无可信归档的代传及跨截点恢复不属于本分支。
      TEMP 审批重验原 E2A OPEN/STOP/完整页和审计、冻结正文、原资格与完整实物清单；inputHighWatermark 是来源订单序号。
      本阶段 TEMP 清单仅支持全部 RETAINED，保留原占用及账务，库存或基线冲突不能因审批清除。
      TEMP PREPARE 须额外传 targetAuthorizationId，绑定指定接收人本机的通用 TEMP 授权及原下载确认；
      原签名、身份版本、恢复代次、库存/映射/政策和期限均重新核验，R06 专用续作授权不可替代。
      准备票据在原字段外包含 temporaryQualification，固定原来源/轮次/计划/正文和接收资格；不签发 FORMAL assignment，不延长授权。
      接收机 manifest 标明 sourceKind=TEMP、packageKind=TEMP_FROZEN_PAYLOAD；recoveryPackageSha256 是原冻结正文摘要，
      recovery-package 返回逐字节一致的原冻结正文。两者均仅限指定人员/设备且每次重验原证据与有效资格。
      TEMP ACTIVATE 只消费本案件 PREPARE 生成的专用票据及指定接收人在同一本人在线会话生成的原确认；
      在锁内重验原来源、本人资格、权限/身份版本/期限/恢复代次、完整清单与原签名，缺 session 的历史确认仅可重放。
      激活推进唯一 scope/slot 轮次并关闭本案件开案槽，保留占用直接转 TEMP_HANDOVER_RESERVED，不释放或记账。
      新 TEMP 授权及 clientOrderId 独立于 FORMAL assignment 和 R06 同人同机票据，新期限不得超过本人原资格。
      同事务保存消费证明、原回执、审计及 outbox；重试返回原字节，异文/新键不得重复激活。
      TEMP 接收人不要求 FORMAL pda:assign 权限。审批、准备及激活回执五项能力均为 false；
      TEMP 减包保持拒绝；Android 受控接收、继承前缀、新扫码、冻结/上传与成功回执消费沿独立临时交接协议执行。
    security: [{webSession: []}]
    responses:
      '200':
        description: 原业务回执 JSON 字节（不经 Envelope 重序列化）
        headers:
          Cache-Control: {schema: {type: string, const: no-store}}
        content:
          application/json:
            schema: {type: string, format: binary}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}

FaultFence:
  $ref: './handover-fault-schema.yaml#/Command'

TemporaryPreparation:
  description: TEMP 来源的 PREPARE 命令；不适用于 FORMAL 来源。
  type: object
  additionalProperties: false
  required: [commandVersion, commandType, commandId, warehouseId, caseId, transportRecoveryEpoch, targetDeviceId, targetUserId, targetAuthorizationId, expected]
  properties:
    commandVersion: {type: integer, const: 1}
    commandType: {type: string, const: PREPARE}
    commandId: {type: string, format: uuid}
    warehouseId: {type: string, format: uuid}
    caseId: {type: string, format: uuid}
    transportRecoveryEpoch: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    targetDeviceId: {type: string, format: uuid}
    targetUserId: {type: string, format: uuid}
    targetAuthorizationId: {type: string, format: uuid}
    reason: {type: string}
    expected:
      type: object
      additionalProperties: false
      required: [caseId, caseVersion, status, userAuthVersion]
      properties:
        caseId: {type: string, format: uuid}
        caseVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
        status: {type: string, const: APPROVED}
        userAuthVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}

TemporaryQualification:
  type: object
  additionalProperties: false
  required: [authorizationId, manifestSha256, expiresAt, serverRecoveryEpoch, userAuthVersion, deviceVersion, sourceKind, scopeId, mappingVersion, fromWorkRound, toWorkRound, planSha256, payloadSha256]
  properties:
    authorizationId: {type: string, format: uuid}
    manifestSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    expiresAt: {type: string, format: date-time}
    serverRecoveryEpoch: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    userAuthVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    deviceVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    sourceKind: {type: string, const: TEMP}
    scopeId: {type: string, format: uuid}
    mappingVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    fromWorkRound: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    toWorkRound: {type: string, pattern: '^[1-9][0-9]{0,17}$'}
    planSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    payloadSha256: {type: string, pattern: '^[a-f0-9]{64}$'}

TemporaryPreparedTicket:
  type: object
  additionalProperties: false
  required: [caseId, targetDeviceId, targetUserId, inputHighWatermark, canonicalOrderId, issuedAt, temporaryQualification]
  properties:
    caseId: {type: string, format: uuid}
    targetDeviceId: {type: string, format: uuid}
    targetUserId: {type: string, format: uuid}
    inputHighWatermark: {type: string, pattern: '^(0|[1-9][0-9]{0,17})$'}
    canonicalOrderId: {type: string, format: uuid}
    issuedAt: {type: string, format: date-time}
    temporaryQualification: {$ref: '#/TemporaryQualification'}

TemporaryActivation:
  $ref: './handover-temporary-activation.yaml#/Command'

TemporaryActivationDecision:
  $ref: './handover-temporary-activation.yaml#/Decision'
