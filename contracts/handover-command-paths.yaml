Execute:
  post:
    summary: 执行一次 PDA 交接命令（REQUEST/APPROVE/PREPARE/ACTIVATE）
    description: 请求体是规范 JSON 命令，原键为命令体里的 commandId：同键同文返回原回执字节，同键异文返回 409 IDEMPOTENCY_CONTENT_MISMATCH。命令面默认关闭（outbound.handover.commands.enabled=false 时该路径不存在）；即使启用，签名回执的五项能力仍全为 false——批准或激活交接都不放行库存、不恢复扫码、不允许本机删除。激活在服务端代目标设备签发离线授权，输入形状与 PDA 领取一致，否则设备端验签失败。
    security: [{webSession: []}]
    responses:
      '200':
        description: 原业务回执 JSON 字节（不经 Envelope 重序列化）
        headers:
          Cache-Control: {schema: {type: string, const: no-store}}
        content:
          application/json:
            schema: {type: string, format: binary}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}
