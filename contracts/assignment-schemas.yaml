Command:
  type: object
  required: [expectedVersion, areaNote]
  properties:
    expectedVersion: {type: string, pattern: '^[1-9][0-9]{0,17}$', description: 待领取列表的rowVersion，不是revision}
    areaNote: {type: string, maxLength: 500, description: 可空的人工货堆备注，不代表条码预留}
View:
  type: object
  required: [id, orderId, revision, deviceId, deviceCode, operatorId, operatorName, epoch, serverRecoveryEpoch, inventorySnapshotId, planSha256, inventorySha256, startOrderScanSeq, allocationVersion, status, areaNote, issuedAt, expiresAt, downloadAckAt, offlineToken, offlineAuthorizationId, authorizationSequence]
  properties:
    id: {type: string, format: uuid}
    orderId: {type: string, format: uuid}
    revision: {type: integer}
    deviceId: {type: string, format: uuid}
    deviceCode: {type: string}
    operatorId: {type: string, format: uuid}
    operatorName: {type: string}
    epoch: {type: string, description: 本订单的授权代次，首次为1}
    serverRecoveryEpoch: {type: string}
    inventorySnapshotId: {type: string, format: uuid}
    planSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    inventorySha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 库存内容摘要，尚非下载包摘要}
    startOrderScanSeq: {type: string, pattern: '^[1-9][0-9]*$', description: 首轮与故障重发从头作业为1，原前缀续作为完整已核验输入高水位加1}
    workRound: {type: string, pattern: '^[1-9][0-9]*$', description: 签名领取资格绑定的作业轮次；旧资格未含此字段时按1解释，不能用于故障重发新轮}
    allocationVersion: {type: string, const: '0', description: 默认现场分堆模式，不生成条码预留}
    status: {type: string, enum: [ACTIVE, RECALL_PENDING, CLOSED, REVOKED]}
    areaNote: {type: string}
    issuedAt: {type: string, format: date-time}
    expiresAt: {type: string, format: date-time, description: 签发起固定48小时；到期不清除活动占用}
    downloadAckAt: {type: [string, 'null'], format: date-time, description: 收到有效本地激活确认的服务端时间；确认前为null，重复确认不更新}
    offlineToken: {type: [string, 'null'], description: RS256 JWT；活动列表中不是当前人员的凭据返回null}
    offlineAuthorizationId: {type: string, format: uuid}
    authorizationSequence: {type: string, pattern: '^[0-9]+$', description: 同一作业授权历史中的序号；首次为0，续期递增}
RenewalCommand:
  type: object
  required: [authorizationId, assignmentEpoch, orderId, revision, pendingInputCount]
  properties:
    authorizationId: {type: string, format: uuid, description: 当前本机持有的离线授权ID}
    assignmentEpoch: {type: string, pattern: '^[1-9][0-9]*$'}
    orderId: {type: string, format: uuid}
    revision: {type: integer, minimum: 1}
    pendingInputCount: {type: integer, minimum: 0, description: 本机未决输入数量，必须为0}
Page:
  type: object
  required: [items, nextCursor]
  properties:
    items: {type: array, items: {$ref: '#/View'}}
    nextCursor: {type: [string, 'null'], format: uuid}
Summary:
  type: object
  required: [id, deviceCode, operatorName, status, epoch, issuedAt, expiresAt, downloadAckAt, areaNote]
  properties:
    id: {type: string, format: uuid}
    deviceCode: {type: string}
    operatorName: {type: string}
    status: {type: string, enum: [ACTIVE, RECALL_PENDING]}
    epoch: {type: string}
    issuedAt: {type: string, format: date-time}
    expiresAt: {type: string, format: date-time}
    downloadAckAt: {type: [string, 'null'], format: date-time}
    areaNote: {type: string}
