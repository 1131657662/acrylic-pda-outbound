Submit:
  post:
    summary: 显式提交已激活的 TEMP 新轮累积冻结正文
    description: |
      默认关闭的独立 intake 入口。隔离验证须显式启用 continuation-intake；生产入口保持关闭。
      仅支持原人原机、第一轮前驱及其下一轮，前驱须已停止且完整核验，票据须已激活。
      原 captures/scans/events 必须是不可改写的完整前缀；原扫描按原资格、新增扫描按新资格验证。
      原计划与库存政策固定，新增序号沿可信高水位连续递增。一次事务绑定唯一提交、选择新轮、
      保存正文及证据、将票据精确保留占用转移到新提交，并形成待审状态；不确认记账或放行。
      支持尚未生成正式目标的来源，以及未改动的初始 PDA_TEMP 待审目标；受控 LINK 目标拒绝。
      submissionId 为幂等键，完全相同正文可恢复；同键异文、换提交或跨身份重放拒绝。
      新资格缺 download-ack 时保留未激活确认问题，不以票据激活代替资料下载确认。
      此入口仅支持不超过 1MiB 的完整正文，未提供续作分块上传；不得改投普通首轮接口。
    security: [{pdaBearer: []}]
    parameters: [{$ref: './openapi.yaml#/components/parameters/Epoch'}]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: './temporary-round-schemas.yaml#/Body'}
    responses:
      '200': {$ref: './submission-paths.yaml#/Result'}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}
      '413': {description: 超过完整正文限额，须保留原文；续作分块上传尚不可用}
Read:
  get:
    summary: 原人原机读取显式续作提交状态
    description: 默认关闭。要求 pda:submit 权限，并核验新资格、票据与前驱绑定；读操作不激活、不放行、不删除。
    security: [{pdaBearer: []}]
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200': {$ref: './submission-paths.yaml#/Result'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}
