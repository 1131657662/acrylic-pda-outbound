OrderExports:
  parameters:
    - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
    - {$ref: './export-components.yaml#/Order'}
  get:
    summary: 查询本人单订单文件任务
    description: 当前order:read和仓库授权。每页20项；草案增加CORRECTED指定版本任务，basis与resultVersion如实返回。无匹配任务（含不存在的订单）返回200空列表。无权仓库或before属于他人、其他仓库/订单或不存在时返回404。
    parameters:
      - {$ref: './export-components.yaml#/Before'}
    responses:
      '200': {$ref: './export-components.yaml#/PageResponse'}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
  post:
    summary: 申请单订单文件（更正净结果支持为未发布草案）
    description: >-
      当前order:read和仓库授权。原确认沿用首版；支持已完成且原事实可核验的正式PC、FORMAL及TEMP来源，未完成或未核验多设备来源拒绝。
      basis必须显式提供；ORIGINAL_CONFIRMED保留原确认，CORRECTED必须显式传resultVersion大于1且仅支持XLSX/PDF。
      CORRECTED使用指定版本的既有更正快照和渲染路径，带调整凭据。CURRENT_EFFECTIVE省略或null版本，在申请时固定截止时最新净值；跨订单最新净值使用导出中心。
      basis与版本不匹配或CORRECTED漏传版本返回400 EXPORT_VERSION_INVALID；更正扫码模板返回400 EXPORT_FORMAT_UNSUPPORTED；指定版本不存在返回409 EXPORT_SOURCE_UNAVAILABLE。
      固定快照、结果版本、修订、格式和模板；原确认支持通用Excel、扫码记录Excel、PDF；原来源最多5000包，超过为409 EXPORT_SOURCE_UNAVAILABLE，PDF另限原来源1000包，超限为409 EXPORT_LIMIT_EXCEEDED。
      同键改结果版本返回409 IDEMPOTENCY_CONFLICT；省略版本与显式1等价。每账号当前代次最多5项在途任务。锁内再次核验权限，恢复屏障或旧代次拒绝；文件有效期7天。
    parameters:
      - {$ref: './export-components.yaml#/Key'}
      - {$ref: './openapi.yaml#/components/parameters/Epoch'}
      - {$ref: './openapi.yaml#/components/parameters/Csrf'}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: './export-schemas.yaml#/SingleCommand'}
    responses:
      '200': {$ref: './export-components.yaml#/JobResponse'}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}
      '429': {$ref: './openapi.yaml#/components/responses/Error'}
      '503': {$ref: './openapi.yaml#/components/responses/Error'}
Status:
  get:
    summary: 查询本人文件任务状态
    description: 当前order:read、仓库及本人归属。代次变化优先显示INVALIDATED，过期显示EXPIRED。旧持久payload缺少新增字段时仍作为单订单任务读取，缺少resultVersion按1兼容；新任务返回固定的指定结果版本。此更正版本支持为未发布草案。
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - {$ref: './export-components.yaml#/Id'}
    responses:
      '200': {$ref: './export-components.yaml#/JobResponse'}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
File:
  get:
    summary: 下载本人已完成文件
    description: 当前order:read、仓库及本人归属。只允许当前恢复代次且未过期的SUCCEEDED文件，验证长度与SHA-256并记录下载审计；恢复屏障拒绝。失败或过期返回409，文件缺失或校验失败返回410。响应是二进制，不是ApiEnvelope。
    parameters:
      - {$ref: './openapi.yaml#/components/parameters/Warehouse'}
      - {$ref: './export-components.yaml#/Id'}
    responses:
      '200':
        description: XLSX或PDF附件；Cache-Control no-store，Pragma no-cache，X-Content-Type-Options nosniff。
        headers:
          Content-Disposition: {schema: {type: string}, description: attachment，安全生成的文件名。}
          Content-Length: {schema: {type: integer, minimum: 0}}
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
          application/pdf:
            schema: {type: string, format: binary}
      '400': {$ref: './openapi.yaml#/components/responses/Error'}
      '401': {$ref: './openapi.yaml#/components/responses/Error'}
      '403': {$ref: './openapi.yaml#/components/responses/Error'}
      '404': {$ref: './openapi.yaml#/components/responses/Error'}
      '409': {$ref: './openapi.yaml#/components/responses/Error'}
      '410': {$ref: './openapi.yaml#/components/responses/Error'}
      '503': {$ref: './openapi.yaml#/components/responses/Error'}
