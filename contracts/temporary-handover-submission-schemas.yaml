Reference:
  type: object
  additionalProperties: false
  required: [version, ticketId, caseId, predecessorSubmissionId, predecessorPayloadSha256, sourcePrefixSha256]
  properties:
    version: {const: 1}
    ticketId: {type: string, format: uuid}
    caseId: {type: string, format: uuid}
    predecessorSubmissionId: {type: string, format: uuid}
    predecessorPayloadSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    sourcePrefixSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
Control:
  type: object
  required: [source, assignmentId, continuationId, authorizationId, freezeDeviceId, workRound, sourceRecoveryEpoch, temporaryHandover]
  not: {required: [temporaryContinuation]}
  properties:
    source: {$ref: './temporary-submission-schemas.yaml#/Source'}
    assignmentId: {type: 'null'}
    continuationId: {type: 'null'}
    authorizationId: {type: string, format: uuid, description: 独立TEMP交接激活签发的接收人新资格}
    freezeDeviceId: {type: string, format: uuid}
    workRound: {type: string, pattern: '^([2-9]|[1-9][0-9]+)$'}
    sourceRecoveryEpoch: {$ref: './submission-schemas.yaml#/Positive'}
    temporaryHandover: {$ref: '#/Reference'}
  description: source使用激活给出的新client和接收机，freezeDeviceId须一致；前驱/票据/scope/轮次/本人Session及新资格绑定，不能借FORMAL assignment或R06同人同机票据。
Body:
  allOf:
    - $ref: '#/Control'
    - $ref: './temporary-submission-schemas.yaml#/Body/allOf/1'
  description: |
    完整原captures/scans/events按原文保留，新增输入及审计按接收机本机序号。
    计划除新client/设备/资格身份外固定不变，目标逐产品计划重验。
    高轮混合历史按各轮独立资格和不可变前驱重验。大于1MiB正文使用持久分块，最大32MiB；已受理交接新轮可用独立STOP及完整本人E2A证明关闭，不释放占用。
    保存原正文并将保留owner直接转新submission待审；不会扣账、放行或允许删除。
Upload:
  allOf:
    - $ref: '#/Control'
    - type: object
      required: [schemaVersion, submissionId, payloadSha256, byteCount, chunkCount]
      properties:
        schemaVersion: {const: 2}
        submissionId: {type: string, format: uuid}
        payloadSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        byteCount: {type: string, pattern: '^[1-9][0-9]*$'}
        chunkCount: {type: string, pattern: '^([1-9]|[1-9][0-9]|1[01][0-9]|12[0-8])$'}
  unevaluatedProperties: false
Stop:
  type: object
  additionalProperties: false
  required: [submissionId, reason, sourceEvidenceSetId, verificationId, setSha256, temporaryHandover]
  properties:
    submissionId: {type: string, format: uuid}
    reason: {type: string, minLength: 1, maxLength: 500}
    sourceEvidenceSetId: {type: string, format: uuid}
    verificationId: {type: string, format: uuid}
    setSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    temporaryHandover: {$ref: '#/Reference'}
  description: |
    REVIEW_REQUIRED已受理轮保持原协议。已激活、固定分块清单的RECEIVING轮可使用未受理LOCAL_FROZEN_PAYLOAD及完整本人E2A停止；
    必须有原canonical、完整历史/冻结/清单hash与长度证明。该停止签名返回payloadPresent=false、payloadSha256=null、localFrozenPayloadSha256；
    原请求/证据set/verification仍绑定，不写accepted payload、不扣账、不释放、不删除。无冻结/无canonical/普通REGISTERED拒绝。
