# Review candidate for acrylic-outbound-test-backup.service.d/60-r09-resources.conf
[Service]
MemoryHigh=512M
MemoryMax=768M
CPUQuota=50%
TasksMax=64
TimeoutStartSec=30min
TimeoutStopSec=120
Nice=15
IOSchedulingClass=idle
UMask=0077
# Hard termination can prevent the existing backup.sh EXIT trap from restarting
# the test API. A timeout/OOM must leave a visible failed unit and require the
# stopped-service runbook; do not configure automatic restart of the backup.
