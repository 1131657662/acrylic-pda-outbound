# Review candidate for acrylic-outbound-test.service.d/60-r09-resources.conf
# Existing R02 limits are retained; validate headroom before installing.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
MemoryHigh=768M
MemoryMax=1G
CPUQuota=100%
TasksMax=256
LimitNOFILE=8192
Restart=on-failure
RestartSec=10
TimeoutStopSec=60
OOMPolicy=stop
# JVM Xmx512m and Hikari pool8 remain in the existing R02 service/application.
# Never copy this drop-in to shared MySQL, Nginx, WMS or MES units.
