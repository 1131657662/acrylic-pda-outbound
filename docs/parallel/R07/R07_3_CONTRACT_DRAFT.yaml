# R07-3 更正命令面 —— 契约草案（**未发布**）
#
# 状态：准备稿。**不得**并入 `contracts/openapi.yaml`，直到下面「发布前置」全部满足——
# 看板事实块的 contract/paths 由 `contracts/openapi.yaml` 推导，提前并入等于对外声明一个尚未开放的能力。
#
# 与设计 §5 的差异（需在契约阶段确认）：
#   §5 草案按动作分路径（`/corrections`、`/corrections/{id}/approve`、`/corrections/{id}/withdraw`）；
#   R06 已实现并验证的命令面约定是**单端点 + 正文 commandType**（`/temporary-commands` 的 LINK/NORMAL_CONFIRM 形态）。
#   本实现沿用后者（PDA 别名 + 单端点），并在正文里用 commandType 区分五种命令。此项属契约决策。
#
# 发布前置（全绿才可并入）：
#   1) `outbound.corrections.commands.enabled=true` 的**运维授权**（业主），且能力声明与开关同步；
#   2) ~~Web 路由 `/api/v1/corrections` 的真 HTTP 证据~~ **已具备**（2026-09-27，attempt 292：Web 会话 + CSRF + Cookie
#      往返下 ①开关关闭 404 ②形状错误 400 `INVALID_CORRECTION_COMMAND` ③未知订单 404 `CORRECTION_DOCUMENT_NOT_FOUND`）；
#      根因（会话 Cookie 默认 `Secure` 与明文 HTTP 冲突）已在 harness 侧显式 `OUTBOUND_COOKIE_SECURE=false` 解决，生产默认未改；
#   3) 申请人确认机制（P-R07-08 的确认半程）——**已实现**（V48 + WITHDRAW/WITHDRAW_CONFIRM，attempts 255/256）；
#      仍缺：待确认是否有期限、申请人可否拒绝、拒绝后单据去向（政策项，见 §政策待决）；
#   4) `contracts/openapi.yaml` 版本号由维护者按事实块统一分配后递增；
#   5) 本文件的路径与 schema 通过 `tools/version_facts.ps1 -Check` 的一致性校验（并入后）。
#
# 草案自审（2026-09-28，自主运行 v11 / D1）：逐条与实现核对（`CorrectionCommand.KINDS`、
# `CorrectionOperations`、`CorrectionReconciliations`、`CorrectionCommand` 的限额与窗口常量）——
#   - 命令类型：实现为 **6 种** `CREATE / APPROVE / WITHDRAW / WITHDRAW_CONFIRM / RECONCILE_OPEN / RECONCILE_ADVANCE`；
#     本草案原先只列 5 种且把「确认半程」标为未实现 ⇒ **本轮已补齐 WITHDRAW_CONFIRM 并更正状态**。
#   - 限额与窗口与实现一致：附件单文件 10MB / 单条 5 个 / 单次 50MB（`CorrectionCommand:50`、
#     `CorrectionOperations:122`）；补录窗口 3 天（`CorrectionCommand:47`）。
#   - 权限：`outbound:correct` / `correction:approve` / `inventory:reconcile` 与实现一致；
#     WITHDRAW/WITHDRAW_CONFIRM 另有「原审批人 / 申请人」身份断言（`CorrectionOperations.Withdraw`/`WithdrawConfirm`）。
#
# §政策待决（不阻塞草案完善，阻塞发布后的行为定义）：
#   - 撤销是否有期限、申请人可否拒绝、拒绝/超期后单据是撤回还是作废；
#   - SoD（同一人可否既创建又批准）与 §3 三项审批前置来源；
#   - 契约形态（单端点+commandType 已由实现选定，见下方「与设计 §5 的差异」）。
#
# 已知「已实现但故意未发布」的路由（同一纪律：能力默认关闭 ⇒ 不发布）——并入时需一并处理：
#   - /api/v1/pda/corrections            （R07-3 PDA 别名，本文件即其草案）
#   - /api/v1/pda/temporary-commands     （R06 命令面 PDA 别名）
#   - /api/v1/pda/local-draft-evidence   （R06 草稿证据面）
# 2026-09-27 全局扫描（收口文档 §7.2）：除此之外未发现"应发布却缺失"的路由。

openapi: 3.1.0
info:
  title: R07-3 更正命令面（草案，未发布）
  version: 0.0.0-draft
paths:
  /api/v1/corrections:
    post:
      summary: 更正命令（单端点 + 正文 commandType）
      description: |
        与 PDA 别名 `/api/v1/pda/corrections` 同一控制器；默认关闭时该路径不存在（404）。
        原键幂等：同一 commandId + 同一规范化正文回放存储的原始字节；正文不同 → 409。
      security: [{ bearerPda: [] }, { webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CorrectionCreate'
                - $ref: '#/components/schemas/CorrectionApprove'
                - $ref: '#/components/schemas/CorrectionWithdraw'
                - $ref: '#/components/schemas/CorrectionWithdrawConfirm'
                - $ref: '#/components/schemas/ReconcileOpen'
                - $ref: '#/components/schemas/ReconcileAdvance'
      responses:
        '200': { description: 签名回执（原字节，原键重放时逐字节一致） }
        '400': { description: |
            CORRECTION_EVIDENCE_REQUIRED、ATTACHMENT_LIMIT_EXCEEDED（单文件 10MB / 单条 5 个 / 单次 50MB）、
            INVALID_CORRECTION_COMMAND（含表头补丁：未知键/服务端持有键/非标量/空操作）、INVALID_REQUEST_ID }
        '401': { description: 会话缺失或失效 }
        '403': { description: CORRECTION_PERMISSION_DENIED（缺 outbound:correct / correction:approve / inventory:reconcile，
            或非原审批人发起撤销、非申请人确认撤销） }
        '404': { description: |
            CORRECTION_COMMAND_NOT_OPEN（开关关闭：路径未装配）、CORRECTION_DOCUMENT_NOT_FOUND（单/订单/案件不存在或跨仓） }
        '409': { description: |
            CORRECTION_CONTEXT_CHANGED、CORRECTION_LINE_TARGET_UNCHANGED、CORRECTION_WINDOW_EXCEEDED、
            CORRECTION_LEDGER_CONFLICT、CYCLE_REOPENING_EXISTS、CORRECTION_RESULT_UNKNOWN、
            IDEMPOTENCY_CONTENT_MISMATCH（同原键异正文）、CORRECTION_RECEIPT_SHAPE、
            CORRECTION_RECEIPT_INTEGRITY_FAILURE }
        # 说明（2026-09-27 扫描）：CORRECTION_ALREADY_EFFECTIVE 已在 §5 草案中命名，但当前实现用
        # expected 的 status 检查 + 状态谓词 UPDATE 挡住了重复生效路径，该码**可达性为零**；
        # 若契约阶段要求它对客户端可辨，需要在生效路径上显式区分"已生效"与"上下文变化"。
components:
  securitySchemes:
    bearerPda: { type: http, scheme: bearer, description: PDA 会话令牌（该前缀关闭 CSRF） }
    webSession: { type: apiKey, in: cookie, name: OUTBOUND_SESSION, description: Web 会话 + CSRF 头 }
  schemas:
    Receipt:
      type: object
      required: [receiptVersion, receiptId, commandId, routeScope, commandType, commandSha256, status, recordedAt,
                 eventId, documentId, orderId, context, actor, businessDecision, expected, capabilities, signedReceipt]
      properties:
        status: { const: RECORDED }
        capabilities:
          description: 五个能力位恒为 false（更正绝不放行、绝不释放库存、绝不删除本地数据）
          type: object
          properties:
            writeConfirmationAvailable: { const: false }
            releaseAllowed: { const: false }
            mayResumeScanning: { const: false }
            stockReleased: { const: false }
            localDeletionAllowed: { const: false }
    CorrectionCreate:
      type: object
      required: [commandVersion, commandType, commandId, transportRecoveryEpoch, warehouseId, orderId, type, reason,
                 lines, expected]
      properties:
        commandType: { const: CREATE }
        type: { enum: [PHYSICAL_RETURN, DISPATCH_CANCELLATION, WEIGHT_CORRECTION, HEADER_CORRECTION] }
        lines:
          description: 逐行目标值；before 侧由服务端从当前版本事实重算，客户端只能提目标
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              dispatchId: { type: string, format: uuid }
              targetCount: { type: string }
              targetWeightG: { type: string }
              evidenceId: { type: string, format: uuid, description: 实物类型必填 }
              evidenceSha256: { type: string, description: 实物类型必填 }
        expected:
          description: 乐观并发：orderId + currentResultVersion + 有效包数/重量 + userAuthVersion
          type: object
    CorrectionApprove:
      description: 主管门（correction:approve）；同一事务内生效——结果版本 v+1、effect、更正账务、逐包快照、指针、发件箱
      type: object
      properties: { commandType: { const: APPROVE }, documentId: { type: string, format: uuid } }
    CorrectionWithdraw:
      description: |
        误批撤销的**第一步**（P-R07-08）：仅原审批人可发起；document 进入 `WITHDRAW_PENDING`，
        此时**账务尚未回退**（误批仍在生效），等待申请人确认。
      type: object
      properties: { commandType: { const: WITHDRAW }, documentId: { type: string, format: uuid } }
    CorrectionWithdrawConfirm:
      description: |
        误批撤销的**第二步**（P-R07-08 确认半程，V48 已实现）：仅**申请人**（`requestedBy`）可确认；
        确认后账务**逐笔回退**——该文档写过的每一行 `correction_ledger` 新增一行经 `reverses_entry_id`
        指向原行、delta 完全相反，并按回退后合计发布**新的结果版本**；原批准、撤销请求与确认全部留痕，
        不重写、不删除。前置状态必须为 `WITHDRAW_PENDING`，否则 409 `CORRECTION_CONTEXT_CHANGED`；
        若期间有其它更正改变了明细状态，逐笔回退会静默覆盖 ⇒ 409 `CORRECTION_LEDGER_CONFLICT`。
        政策未定：本步是否有期限、申请人可否拒绝（拒绝后单据去向）——见文件头「§政策待决」。
      type: object
      properties: { commandType: { const: WITHDRAW_CONFIRM }, documentId: { type: string, format: uuid } }
    ReconcileOpen:
      description: 差异案件（步骤 7）；不产生任何库存/结果写入
      type: object
      properties:
        commandType: { const: RECONCILE_OPEN }
        kind: { enum: [MISSING_PACKAGE, WEIGHT_MISMATCH, CYCLE_CONFLICT, OTHER] }
    ReconcileAdvance:
      description: OPEN→EVIDENCE_PENDING→REVIEW_READY→RESOLVED；blocked=true + 原因 → BLOCKED；终态不可再推进
      type: object
      properties:
        commandType: { const: RECONCILE_ADVANCE }
        caseId: { type: string, format: uuid }
        conclusion: { type: string, description: 结案必填 }
        blocked: { type: boolean }
