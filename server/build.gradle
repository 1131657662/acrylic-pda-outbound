plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.acrylic.outbound'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation('com.acrylic.outbound:acrylic-report-rendering') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-jul'
    }
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'
    testLogging { events 'failed', 'skipped' }
}
tasks.named('test') { exclude '**/*IT.class' }
tasks.register('integrationTest', Test) {
    description = 'Real MySQL integration tests; OUTBOUND_DB_* must point to an isolated test database.'
    // Each invocation consumes an external, disposable database, even when the compiled tests are unchanged.
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter test
}

tasks.register('recoveryControlClasspath') {
    dependsOn testClasses
    doLast {
        def target = layout.buildDirectory.file('recovery-control-classpath.json').get().asFile
        target.text = groovy.json.JsonOutput.toJson(sourceSets.test.runtimeClasspath.files.collect { it.absolutePath })
    }
}

// Ordinary lease tests launch disposable owner JVMs with the actual test runtime dependencies.
tasks.named('test') {
    dependsOn tasks.named('recoveryControlClasspath')
    dependsOn tasks.named('recoveryRekeyClasspath')
}

tasks.register('recoveryRekeyClasspath') {
    dependsOn classes
    doLast {
        def target = layout.buildDirectory.file('recovery-rekey-classpath.json').get().asFile
        target.text = groovy.json.JsonOutput.toJson(sourceSets.main.runtimeClasspath.files.collect { it.absolutePath })
    }
}
