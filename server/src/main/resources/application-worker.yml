spring:
  main:
    web-application-type: none
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: 30s
outbound:
  worker:
    enabled: true
    poll-ms: 1000
