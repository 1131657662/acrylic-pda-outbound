server {
    listen 80;
    server_name outbound-test.nbsmzwl.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acrylic-outbound-test/acme;
        try_files $uri =404;
    }
    location / { return 301 https://outbound-test.nbsmzwl.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name outbound-test.nbsmzwl.cn;
    ssl_certificate /etc/letsencrypt/live/outbound-test.nbsmzwl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outbound-test.nbsmzwl.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/acrylic-outbound-test/current/web;
    index index.html;
    client_max_body_size 6m;
    include /etc/acrylic-outbound-test/security-headers.conf;
    location /api/ { include /etc/acrylic-outbound-test/proxy.conf; }
    location = /pda-download-config.json {
        alias /opt/acrylic-outbound-test/public-config/pda-download-config.json;
        default_type application/json;
        include /etc/acrylic-outbound-test/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /pda-download {
        try_files /index.html =404;
        include /etc/acrylic-outbound-test/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location /downloads/ {
        alias /opt/acrylic-outbound-test/downloads/;
        autoindex off;
        default_type application/octet-stream;
    }
    location ^~ /updates/debug/ { return 404; }
    location /updates/ {
        if (-f /opt/acrylic-outbound-test/public-config/pda-updates-paused) { return 410; }
        alias /opt/acrylic-outbound-test/updates/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        include /etc/acrylic-outbound-test/security-headers.conf;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
        include /etc/acrylic-outbound-test/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
