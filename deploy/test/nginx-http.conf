# Certificate bootstrap only. Replace with nginx.conf after certificate issuance.
server {
    listen 80;
    server_name outbound-test.nbsmzwl.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acrylic-outbound-test/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
